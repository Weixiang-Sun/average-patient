[project]
name = "mental-act"
version = "0.1.0"
description = "The Average Patient: Do Simulated Psychiatric Patients Answer Like Real People?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "tenacity>=8.2",
    "anthropic>=1.3.0",
    "scikit-learn>=1.9.0",
    "pyreadstat>=1.3.6",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mental_act"]
